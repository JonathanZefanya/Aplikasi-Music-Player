allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

gradle.projectsEvaluated {
    subprojects {
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << '-Xlint:-options'
        }
    }
}

rootProject.layout.buildDirectory.set(rootProject.layout.projectDirectory.dir('../build'))
subprojects {
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt == null) {
            return
        }

        if (androidExt.hasProperty('compileSdk')) {
            androidExt.compileSdk = 36
        } else if (androidExt.metaClass.respondsTo(androidExt, 'compileSdkVersion', Integer)) {
            androidExt.compileSdkVersion 36
        }

        if (androidExt.hasProperty('compileOptions')) {
            androidExt.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        // Kotlin harus mengikuti target Java milik modul itu sendiri. Memaksa '17' di sini
        // membuat modul yang javac-nya tetap 1.8 gagal dengan
        // "Inconsistent JVM-target compatibility".
        subproject.afterEvaluate {
            def javaTarget = androidExt.compileOptions.targetCompatibility.toString()

            subproject.tasks.configureEach { task ->
                if (task.hasProperty('kotlinOptions')) {
                    task.kotlinOptions {
                        jvmTarget = javaTarget
                    }
                }
            }
        }

        def hasNamespace = androidExt.hasProperty('namespace') && androidExt.namespace != null
        if (hasNamespace) {
            return
        }

        def manifestFile = subproject.file('src/main/AndroidManifest.xml')
        if (!manifestFile.exists()) {
            return
        }

        def manifest = new XmlSlurper(false, false).parse(manifestFile)
        def manifestPackage = manifest.@package?.text()
        if (manifestPackage) {
            androidExt.namespace = manifestPackage
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
