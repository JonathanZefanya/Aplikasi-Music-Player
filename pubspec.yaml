name: music
description: "music is a local music player app that plays music from your device built with Flutter."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.0+1

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  audio_session: ^0.1.21 # audio focus, headphone & bluetooth events
  audiotags: ^1.4.5
  bloc: ^8.1.4 # state management
  dynamic_color: 1.7.0 # material you / dynamic color
  file_picker: ^11.0.3
  flutter:
    sdk: flutter # flutter sdk
  flutter_bloc: ^8.1.6 # state management
  flutter_cache_manager: ^3.4.1 # cache manager
  flutter_staggered_animations: ^1.1.1 # animation
  fluttertoast: ^9.0.0
  get_it: ^8.0.0 # dependency injection
  hive: ^2.2.3 # local database
  hive_flutter: ^1.1.0 # local database
  image_picker: ^1.2.0 # pick custom theme image
  just_audio: ^0.9.41 # audio player
  just_audio_background: ^0.0.1-beta.11 # audio player background
  lottie: ^3.1.2 # lottie animation
  marquee: ^2.2.3 # marquee text
  on_audio_query: ^2.9.0 # get songs from device
  package_info_plus: ^8.0.2 # get app info
  palette_generator: ^0.3.3 # album art color palette
  path_provider: ^2.1.5 # app storage path
  permission_handler: ^11.3.1 # get permission
  rxdart: ^0.28.0 # stream
  share_plus: ^10.0.2 # share song
  url_launcher: ^6.3.0 # open url
  font_awesome_flutter: ^10.4.0 # font awesome icons

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # linter
  flutter_launcher_icons: ^0.14.1 # app icon generator

# Fix for marquee dependency after Flutter 3.2.2 upgrade
dependency_overrides:
  fading_edge_scrollview: ^4.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/lottie/
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
# dart pub get
# dart run flutter_launcher_icons
